; PH Typhoon Tracker - PlatformIO project
; Build:  pio run            (or PlatformIO: Build in VS Code)
; Flash:  pio run -t upload  (or PlatformIO: Upload)
; Serial: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev              ; generic ESP32 DevKit (4 MB flash)
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9   ; pulls in Adafruit BusIO
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=1      ; error+warn serial logs from the core
